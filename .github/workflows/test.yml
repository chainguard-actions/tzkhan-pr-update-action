name: "Update Pull Request"

on: pull_request

permissions:
  pull-requests: write

jobs:
  pr_update_text:
    runs-on: ubuntu-latest
    steps:
    - uses: tzkhan/pr-update-action@4cf7489d84ffcb296ea2f771a15e035bff8e3122 # v1
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        branch-regex: 'FOO-\d+'
        lowercase-branch: false
        title-template: '[%branch%]'
        title-prefix-space: true
        uppercase-title: false
        body-template: '[Link to %branch%](https://url/to/browse/ticket/%branch%)'
        body-prefix-newline-count: 2
        uppercase-body: false
