name: Test default inputs (no PR context)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with only the required repo-token input, relying on
      # all other inputs' declared defaults:
      #   branch-regex: 'FOO-\d+'
      #   lowercase-branch: true
      #   title-template: '[%branch%]'
      #   title-prefix-space: true
      #   uppercase-title: true
      #   body-template: '[%branch%](https://url/to/browse/ticket/%branch%)'
      #   body-prefix-newline-count: 2
      #   uppercase-body: true
      #
      # Under workflow_dispatch there is no pull_request payload, so the action
      # will call core.setFailed after catching the TypeError.
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert action failed gracefully with default inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed gracefully with default inputs as expected"
