name: Test custom regex and template inputs (no PR context)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with custom regex and templates.
      # The action will still fail because there is no pull_request payload
      # under workflow_dispatch, but we verify it accepts the inputs without
      # crashing before reaching the payload access.
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          branch-regex: 'PROJ-\d+'
          lowercase-branch: 'false'
          title-template: 'PROJ-%branch%:'
          title-prefix-space: 'true'
          uppercase-title: 'false'
          body-template: 'Ticket: [%branch%](https://jira.example.com/browse/%branch%)'
          body-prefix-newline-count: '1'
          uppercase-body: 'false'

      - name: Assert action failed gracefully with custom inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed gracefully with custom regex/template inputs as expected"
