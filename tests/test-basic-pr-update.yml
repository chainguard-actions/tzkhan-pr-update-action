name: Test basic PR update action invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: FOO-123-my-feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action and capture exit code
        id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          branch-regex: 'FOO-\d+'
          lowercase-branch: 'true'
          title-template: '[%branch%]'
          title-prefix-space: 'true'
          uppercase-title: 'true'
          body-template: '[%branch%](https://example.com/browse/%branch%)'
          body-prefix-newline-count: '2'
          uppercase-body: 'true'
        continue-on-error: true

      - name: Assert action ran without configuration error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail due to no real PR in act environment,
          # but it should not fail due to missing inputs or bad config.
          # Acceptable outcomes: success or failure (API error), not skipped.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
