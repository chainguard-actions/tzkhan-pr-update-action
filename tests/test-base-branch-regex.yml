name: Test with base-branch-regex and body update
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          base-branch-regex: '(main|master|develop)'
          head-branch-regex: '[A-Z]+-[0-9]+'
          lowercase-branch: 'false'
          title-template: '[%basebranch%] %headbranch%'
          title-update-action: replace
          title-uppercase-base-match: 'true'
          title-uppercase-head-match: 'true'
          body-template: 'Ticket: %headbranch%'
          body-update-action: prefix
          body-newline-count: '2'
          body-uppercase-head-match: 'true'
      - name: Assert action ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BASE_MATCH: ${{ steps.action.outputs.baseMatch }}
          HEAD_MATCH: ${{ steps.action.outputs.headMatch }}
          TITLE_UPDATED: ${{ steps.action.outputs.titleUpdated }}
          BODY_UPDATED: ${{ steps.action.outputs.bodyUpdated }}
        run: |
          echo "outcome: $OUTCOME"
          echo "baseMatch: $BASE_MATCH"
          echo "headMatch: $HEAD_MATCH"
          echo "titleUpdated: $TITLE_UPDATED"
          echo "bodyUpdated: $BODY_UPDATED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no PR found under workflow_dispatch / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
