name: Test with no regex configured
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          base-branch-regex: ''
          head-branch-regex: ''
          title-template: ''
          body-template: ''
      - name: Assert action ran with no regex and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BASE_MATCH: ${{ steps.action.outputs.baseMatch }}
          HEAD_MATCH: ${{ steps.action.outputs.headMatch }}
          TITLE_UPDATED: ${{ steps.action.outputs.titleUpdated }}
          BODY_UPDATED: ${{ steps.action.outputs.bodyUpdated }}
        run: |
          echo "outcome: $OUTCOME"
          echo "baseMatch: $BASE_MATCH"
          echo "headMatch: $HEAD_MATCH"
          echo "titleUpdated: $TITLE_UPDATED"
          echo "bodyUpdated: $BODY_UPDATED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with no regex"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no PR found under workflow_dispatch / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
