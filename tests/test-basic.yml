name: Test basic usage with head-branch-regex
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          head-branch-regex: '[A-Z]+-[0-9]+'
          title-template: '[%headbranch%]'
          title-update-action: prefix
          title-insert-space: 'true'
          title-uppercase-head-match: 'true'
      - name: Assert action ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HEAD_MATCH: ${{ steps.action.outputs.headMatch }}
          TITLE_UPDATED: ${{ steps.action.outputs.titleUpdated }}
        run: |
          echo "outcome: $OUTCOME"
          echo "headMatch: $HEAD_MATCH"
          echo "titleUpdated: $TITLE_UPDATED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no PR found under workflow_dispatch / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
