name: Test basic invocation (no PR context)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under workflow_dispatch there is no pull_request payload, so the action
      # will catch a TypeError when it tries to read
      # github.context.payload.pull_request.head.ref and call core.setFailed.
      # We use continue-on-error so the job can proceed to the assertion step.
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          branch-regex: 'FOO-\d+'
          title-template: '[%branch%]'
          body-template: '[%branch%](https://example.com/browse/%branch%)'

      - name: Assert action failed gracefully (expected under non-PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected when no pull_request context is present"
